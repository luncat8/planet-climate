<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geodesic Planet · GPU Climate Engine</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#05070f;color:#e2e8f0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:relative;width:100vw;height:100vh}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

  .hdr{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:16px;pointer-events:none}
  .box{pointer-events:auto;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px}
  .title{font-size:14px;font-weight:600;letter-spacing:.05em;color:#67e8f9}
  .sub{font-size:11px;color:#94a3b8;margin-top:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;display:flex;gap:16px;margin-top:8px}
  .mono .g{color:#6ee7b7}
  .mono .a{color:#fcd34d}
  .mono .s{color:#94a3b8}
  .btn{pointer-events:auto;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:12px;color:#e2e8f0;cursor:pointer}
  .btn:hover{background:rgba(0,0,0,.7)}

  .panel{position:absolute;top:96px;right:16px;bottom:16px;width:300px;overflow-y:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;font-size:12px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .lab{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#94a3b8;margin-bottom:4px}
  .mbtn{border-radius:6px;padding:4px 8px;text-align:left;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e2e8f0}
  .mbtn:hover{background:rgba(255,255,255,.1)}
  .mbtn.on{background:rgba(34,211,238,.25);border-color:rgba(34,211,238,.4);color:#a5f3fc}
  .bar{height:8px;border-radius:9999px;background:linear-gradient(90deg,#0d0640,#0c59bf,#1abfa6,#d9d940,#e65a1a,#a60d1f)}
  .barlab{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-top:2px}
  .chk{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0}
  .chk span{color:#cbd5e1}
  .chk input{accent-color:#22d3ee}
  input[type=range]{width:100%;accent-color:#22d3ee;height:4px}
  .kv{display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;margin-bottom:2px}
  .kv .v{color:#cbd5e1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .togbtn{width:100%;border-radius:6px;padding:6px 8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#e2e8f0;cursor:pointer;text-align:left}
  .togbtn:hover{background:rgba(255,255,255,.1)}
  .desc{font-size:10px;line-height:1.5;color:#64748b;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .err{position:absolute;inset:0;display:grid;place-items:center;padding:32px}
  .errbox{max-width:32rem;border-radius:12px;border:1px solid rgba(239,68,68,.4);background:rgba(127,29,29,.6);padding:24px}
  .errbox h2{margin:0 0 8px;font-size:18px;font-weight:600;color:#fca5a5}
  .errbox p{margin:0;font-size:14px;color:rgba(254,202,202,.8)}
  .run.on{background:rgba(16,185,129,.2);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
  .run.off{background:rgba(245,158,11,.2);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
</div>
<script>
/* =================== math =================== */
var m4 = {
  mul: function (a, b) {
    var o = new Float32Array(16);
    for (var c = 0; c < 4; c++)
      for (var r = 0; r < 4; r++) {
        var s = 0;
        for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
    return o;
  },
  persp: function (fov, asp, n, f) {
    var t = 1 / Math.tan(fov / 2);
    var o = new Float32Array(16);
    o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = (2 * f * n) / (n - f);
    return o;
  },
  look: function (e, c, up) {
    var z = [e[0] - c[0], e[1] - c[1], e[2] - c[2]];
    var l = Math.hypot(z[0], z[1], z[2]); z = [z[0] / l, z[1] / l, z[2] / l];
    var x = [up[1] * z[2] - up[2] * z[1], up[2] * z[0] - up[0] * z[2], up[0] * z[1] - up[1] * z[0]];
    l = Math.hypot(x[0], x[1], x[2]) || 1; x = [x[0] / l, x[1] / l, x[2] / l];
    var y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
    var o = new Float32Array(16);
    o[0] = x[0]; o[1] = y[0]; o[2] = z[0];
    o[4] = x[1]; o[5] = y[1]; o[6] = z[1];
    o[8] = x[2]; o[9] = y[2]; o[10] = z[2];
    o[12] = -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]);
    o[13] = -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]);
    o[14] = -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]);
    o[15] = 1;
    return o;
  },
};

/* =================== params =================== */
function defaultParams() {
  return {
    running: true,
    substeps: 2,
    dt: 1800,
    omega: 7.292e-5,
    nuVelAir: 1.6e5,
    nuTAir: 1.1e5,
    nuVelOcean: 6e3,
    nuTOcean: 4e3,
    fricAirLow: 1.6e-5,
    fricAirHigh: 2.5e-6,
    fricOceanTop: 1.5e-6,
    fricOceanDeep: 6e-7,
    solar: 1361,
    dayNight: 1,
    greenhouse: 0.55,
    kSurf: 22,
    evap: 0.005,
    windStress: 6e-8,
    conv: 6e-6,
    kRad: 2.5,
    lapse: 45,
    thermo: 2e-7,
    cloudK: 1.7,
    rainK: 2200,
    noise: 0.02,
    mode: 0,
    showClouds: true,
    showParticles: true,
    particleOcean: 0,
    showLand: 1,
    nightShading: 1,
    pointSize: 2.2,
    relief: 0.004,
  };
}

/* =================== geodesics =================== */
var PLANET_R = 6.371e6;

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function norm(v) {
  var l = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / l, v[1] / l, v[2] / l];
}
function cross(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0],
  ];
}
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

function buildGrid(level, seed) {
  seed = seed === undefined ? 12345 : seed;
  var t = (1 + Math.sqrt(5)) / 2;
  var pos = [
    [-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0],
    [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t],
    [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1],
  ].map(norm);

  var faces = [
    [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
    [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
    [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1],
  ];

  for (var s = 0; s < level; s++) {
    var cache = new Map();
    var mid = function (a, b) {
      var key = a < b ? a * 1e7 + b : b * 1e7 + a;
      var hit = cache.get(key);
      if (hit !== undefined) return hit;
      var p2 = norm([
        pos[a][0] + pos[b][0],
        pos[a][1] + pos[b][1],
        pos[a][2] + pos[b][2],
      ]);
      var idx = pos.length;
      pos.push(p2);
      cache.set(key, idx);
      return idx;
    };
    var nf = [];
    for (var fi = 0; fi < faces.length; fi++) {
      var f = faces[fi];
      var ab = mid(f[0], f[1]), bc = mid(f[1], f[2]), ca = mid(f[2], f[0]);
      nf.push([f[0], ab, ca], [f[1], bc, ab], [f[2], ca, bc], [ab, bc, ca]);
    }
    faces = nf;
  }

  var V = pos.length;

  var nextMap = new Array(V);
  for (var i = 0; i < V; i++) nextMap[i] = new Map();
  for (var fi2 = 0; fi2 < faces.length; fi2++) {
    var f2 = faces[fi2];
    nextMap[f2[0]].set(f2[1], f2[2]);
    nextMap[f2[1]].set(f2[2], f2[0]);
    nextMap[f2[2]].set(f2[0], f2[1]);
  }

  var rings = new Array(V);
  for (var i2 = 0; i2 < V; i2++) {
    var m = nextMap[i2];
    var start = m.keys().next().value;
    var ring = [start];
    var cur = start;
    for (var g = 0; g < 8; g++) {
      var nx = m.get(cur);
      if (nx === start) break;
      ring.push(nx);
      cur = nx;
    }
    rings[i2] = ring;
  }

  var rnd = mulberry32(seed);
  var OCT = 9;
  var dirs = [], freqs = [], phs = [], amps = [];
  for (var o = 0; o < OCT; o++) {
    var z = rnd() * 2 - 1, a = rnd() * Math.PI * 2, r = Math.sqrt(1 - z * z);
    dirs.push([r * Math.cos(a), z, r * Math.sin(a)]);
    var fr = 1.3 * Math.pow(1.75, o);
    freqs.push(fr);
    phs.push(rnd() * 6.2831853);
    amps.push(1 / Math.pow(fr, 0.85));
  }
  var height = new Float32Array(V);
  for (var i3 = 0; i3 < V; i3++) {
    var h = 0;
    for (var o2 = 0; o2 < OCT; o2++) {
      h += amps[o2] * Math.sin(freqs[o2] * dot(dirs[o2], pos[i3]) + phs[o2]);
    }
    height[i3] = h;
  }
  var sorted = Float32Array.from(height).sort();
  var thr = sorted[Math.floor(sorted.length * 0.7)];
  var span = (sorted[sorted.length - 1] - sorted[0]) * 0.045 + 1e-6;
  var land = new Float32Array(V);
  var landCount = 0;
  for (var i4 = 0; i4 < V; i4++) {
    var x = (height[i4] - thr) / span;
    var sm = Math.min(1, Math.max(0, x));
    land[i4] = sm * sm * (3 - 2 * sm);
    if (land[i4] > 0.5) landCount++;
  }

  var W = 256;
  var H = Math.ceil(V / W);
  var cellA = new Float32Array(W * H * 4);
  var cellB = new Float32Array(W * H * 4);
  var nbrA = new Float32Array(W * H * 6 * 4);
  var nbrB = new Float32Array(W * H * 6 * 4);

  var AXIS = [0, 1, 0];
  var e1s = new Array(V), e2s = new Array(V);
  for (var i5 = 0; i5 < V; i5++) {
    var n = pos[i5];
    var e1 = cross(n, AXIS);
    if (Math.hypot(e1[0], e1[1], e1[2]) < 1e-7) e1 = [1, 0, 0];
    e1 = norm(e1);
    var e2 = cross(e1, n);
    e1s[i5] = e1;
    e2s[i5] = e2;
  }

  var neighbourIdx = rings;

  for (var i6 = 0; i6 < V; i6++) {
    var nn = pos[i6];
    var e1n = e1s[i6], e2n = e2s[i6];
    var ringn = neighbourIdx[i6];
    var mm = ringn.length;

    var duals = [];
    for (var k = 0; k < mm; k++) {
      var a0 = pos[ringn[k]], b0 = pos[ringn[(k + 1) % mm]];
      duals.push(norm([nn[0] + a0[0] + b0[0], nn[1] + a0[1] + b0[1], nn[2] + a0[2] + b0[2]]));
    }
    var area = 0;
    for (var k2 = 0; k2 < mm; k2++) {
      var p = sub(duals[k2], nn), q = sub(duals[(k2 + 1) % mm], nn);
      var c = cross(p, q);
      area += 0.5 * Math.hypot(c[0], c[1], c[2]);
    }
    area *= PLANET_R * PLANET_R;

    cellA[i6 * 4 + 0] = nn[0];
    cellA[i6 * 4 + 1] = nn[1];
    cellA[i6 * 4 + 2] = nn[2];
    cellA[i6 * 4 + 3] = area;
    cellB[i6 * 4 + 0] = e1n[0];
    cellB[i6 * 4 + 1] = e1n[1];
    cellB[i6 * 4 + 2] = e1n[2];
    cellB[i6 * 4 + 3] = land[i6];

    for (var k3 = 0; k3 < 6; k3++) {
      var base = (i6 + k3 * W * H) * 4;
      if (k3 >= mm) {
        nbrA[base + 3] = 0;
        continue;
      }
      var j = ringn[k3];
      var d0 = duals[(k3 - 1 + mm) % mm], d1 = duals[k3];
      var ev = sub(d1, d0);
      var len = Math.hypot(ev[0], ev[1], ev[2]) * PLANET_R;
      var dist = Math.acos(Math.max(-1, Math.min(1, dot(nn, pos[j])))) * PLANET_R;

      var pj = pos[j];
      var dp = dot(pj, nn);
      var tv = [pj[0] - nn[0] * dp, pj[1] - nn[1] * dp, pj[2] - nn[2] * dp];
      tv = norm(tv);
      var nx = dot(tv, e1n), ny = dot(tv, e2n);

      var ej = e1s[j];
      var dpe = dot(ej, nn);
      var te = [ej[0] - nn[0] * dpe, ej[1] - nn[1] * dpe, ej[2] - nn[2] * dpe];
      te = norm(te);
      var rotA = dot(te, e1n), rotB = dot(te, e2n);

      nbrA[base + 0] = j;
      nbrA[base + 1] = len;
      nbrA[base + 2] = Math.max(dist, 1.0);
      nbrA[base + 3] = 1;
      nbrB[base + 0] = nx;
      nbrB[base + 1] = ny;
      nbrB[base + 2] = rotA;
      nbrB[base + 3] = rotB;
    }
  }

  var indices = new Uint32Array(faces.length * 3);
  for (var f3 = 0; f3 < faces.length; f3++) {
    indices[f3 * 3 + 0] = faces[f3][0];
    indices[f3 * 3 + 1] = faces[f3][1];
    indices[f3 * 3 + 2] = faces[f3][2];
  }

  var lookupW = 1024, lookupH = 512;
  var lookup = new Float32Array(lookupW * lookupH);
  var guess = 0;
  for (var y = 0; y < lookupH; y++) {
    var lat = ((y + 0.5) / lookupH - 0.5) * Math.PI;
    var rowGuess = guess;
    for (var x2 = 0; x2 < lookupW; x2++) {
      var lon = ((x2 + 0.5) / lookupW - 0.5) * Math.PI * 2;
      var d3 = [
        Math.cos(lat) * Math.cos(lon),
        Math.sin(lat),
        Math.cos(lat) * Math.sin(lon),
      ];
      var cur2 = rowGuess;
      var best = dot(pos[cur2], d3);
      for (var it = 0; it < 256; it++) {
        var moved = false;
        var ringc = neighbourIdx[cur2];
        for (var kk = 0; kk < ringc.length; kk++) {
          var cand = ringc[kk];
          var ss = dot(pos[cand], d3);
          if (ss > best) { best = ss; cur2 = cand; moved = true; }
        }
        if (!moved) break;
      }
      lookup[y * lookupW + x2] = cur2;
      rowGuess = cur2;
      if (x2 === 0) guess = cur2;
    }
  }

  return {
    level: level, V: V, W: W, H: H, cellA: cellA, cellB: cellB,
    nbrA: nbrA, nbrB: nbrB, indices: indices,
    lookup: lookup, lookupW: lookupW, lookupH: lookupH,
    landFraction: landCount / V,
  };
}

/* =================== shaders =================== */
var SHADER_HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
`;

var SHADER_COMMON = `
uniform ivec2 uDim;          // W, H of the cell texture
uniform int   uCount;        // number of real cells (V)
uniform sampler2D uCellA;    // pos.xyz , area
uniform sampler2D uCellB;    // east.xyz, land
uniform sampler2D uNbrA;     // idx , edgeLen , dist , valid
uniform sampler2D uNbrB;     // nx , ny , rotA , rotB

ivec2 cTex(int i){ int y = i / uDim.x; return ivec2(i - y*uDim.x, y); }
ivec2 nTex(int i,int k){ int y = i / uDim.x; return ivec2(i - y*uDim.x, y + k*uDim.y); }

vec2 xfer(vec2 v, float ra, float rb){ return vec2(ra*v.x - rb*v.y, rb*v.x + ra*v.y); }

float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

float qsat(float T, float P){
  float es = 611.2*exp(17.67*(T-273.15)/max(T-29.65, 20.0));
  return clamp(0.622*es/max(P-0.378*es, 100.0), 0.0, 0.08);
}
`;

var QUAD_VS = SHADER_HEAD + `
void main(){
  vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2));
  gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
}`;

var OCEAN_FS = SHADER_HEAD + SHADER_COMMON + `
layout(location=0) out vec4 oTop;
layout(location=1) out vec4 oDeep;

uniform sampler2D uTop;
uniform sampler2D uDeep;
uniform float uDt, uOmega, uNuVel, uNuT, uFricTop, uFricDeep, uAlphaT, uBetaS;
uniform float uPkTop, uPkDeep;

float oceanP(vec4 s, float pk){
  return pk*(uAlphaT*(s.x-283.0) - uBetaS*(s.w-35.0));
}

vec4 stepOcean(int cell, vec3 n, vec3 e1, vec3 e2, float area, float land,
               sampler2D tex, float fric, float pk)
{
  vec4 s0 = texelFetch(tex, cTex(cell), 0);
  vec2 v0 = s0.yz;
  vec2 tr0 = vec2(s0.x, s0.w);
  float p0 = oceanP(s0, pk);

  vec2 gradP = vec2(0.0), lapV = vec2(0.0), advV = vec2(0.0);
  vec2 lapT  = vec2(0.0), advT = vec2(0.0);
  float div = 0.0;

  for(int k=0;k<6;k++){
    vec4 na = texelFetch(uNbrA, nTex(cell,k), 0);
    if(na.w < 0.5) continue;
    int   j = int(na.x);
    float L = na.y;
    float d = na.z;
    vec4  nb = texelFetch(uNbrB, nTex(cell,k), 0);
    vec2  nrm = nb.xy;

    vec4 sj    = texelFetch(tex,   cTex(j), 0);
    float landj= texelFetch(uCellB,cTex(j), 0).w;
    float wet  = (1.0-landj)*(1.0-land);

    vec2 vj  = xfer(sj.yz, nb.z, nb.w) * (1.0-landj);
    vec2 trj = vec2(sj.x, sj.w);
    float pj = oceanP(sj, pk);

    gradP += L*0.5*(pj-p0)*nrm*wet;
    lapV  += (L/d)*(vj-v0)*wet;
    lapT  += (L/d)*(trj-tr0);
    float un = 0.5*dot(v0+vj, nrm)*wet;
    div  += L*un;
    float w = un > 0.0 ? 0.0 : 1.0;
    advT += L*un*mix(tr0, trj, w);
    advV += L*un*mix(v0,  vj,  w);
  }

  float ia = 1.0/area;
  gradP *= ia; lapV *= ia; lapT *= ia; advV *= ia; advT *= ia; div *= ia;

  vec2 acc = -gradP/1027.0 + uNuVel*lapV - advV + v0*div;
  vec3 v3 = v0.x*e1 + v0.y*e2;
  vec3 c3 = -2.0*cross(vec3(0.0,uOmega,0.0), v3);
  acc += vec2(dot(c3,e1), dot(c3,e2));

  vec2 v1 = (v0 + uDt*acc)/(1.0 + uDt*fric);
  v1 *= (1.0-land);
  v1 = clamp(v1, vec2(-3.0), vec2(3.0));

    console.error(name + ' link: ' + gl.getProgramInfoLog(p));

}
Prog.prototype._sh = function (type, src) {
  var gl = this.gl;
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    var log = gl.getShaderInfoLog(s) || '';
    console.error(this.name + ' compile: ' + log);
    var m = /:(\d+):/.exec(log);
    if (m) console.error(src.split('\n').slice(Math.max(0, +m[1] - 4), +m[1] + 3).join('\n'));
  }
  return s;
};
Prog.prototype.use = function () {
  this.gl.useProgram(this.prog);
  this.unit = 0;
  return this;
};
Prog.prototype._u = function (n) {
  if (!this.loc.has(n)) this.loc.set(n, this.gl.getUniformLocation(this.prog, n));
  return this.loc.get(n);
};
Prog.prototype.f = function (n, v) { this.gl.uniform1f(this._u(n), v); return this; };
Prog.prototype.i = function (n, v) { this.gl.uniform1i(this._u(n), v); return this; };
Prog.prototype.iv2 = function (n, a, b) { this.gl.uniform2i(this._u(n), a, b); return this; };
Prog.prototype.v3 = function (n, a, b, c) { this.gl.uniform3f(this._u(n), a, b, c); return this; };
Prog.prototype.m4 = function (n, m) { this.gl.uniformMatrix4fv(this._u(n), false, m); return this; };
Prog.prototype.tex = function (n, t) {
  var gl = this.gl;
  var l = this._u(n);
  if (l === null) return this;
  gl.activeTexture(gl.TEXTURE0 + this.unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.uniform1i(l, this.unit);
  this.unit++;
  return this;
};

/* =================== Planet =================== */
function Planet(canvas, level) {
  var gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  this.gl = gl;
  if (!gl.getExtension('EXT_color_buffer_float')) {
    throw new Error('EXT_color_buffer_float is required (float render targets).');
  }
  gl.getExtension('OES_texture_float_linear');
  this.canvas = canvas;
  this.params = defaultParams();
  this.grid = null;
  this.simTime = 0;
  this.onStats = null;

  this.A = []; this.B = [];
  this.texCellA = null; this.texCellB = null;
  this.texNbrA = null; this.texNbrB = null;
  this.texLookup = null;
  this.partTex = []; this.partIdx = 0;
  this.PW = 160; this.PH = 160;

  this.fbo = {};
  this.prog = {};
  this.vaoGlobe = null; this.vaoEmpty = null; this.ibo = null;
  this.raf = 0;
  this.frames = 0; this.lastFps = performance.now(); this.fps = 60;
  this.cam = { theta: 0.6, phi: 0.25, dist: 3.0 };
  this.drag = false; this.lx = 0; this.ly = 0;
  this.disposed = false;

  var self = this;
  this._onDown = function (e) {
    self.drag = true; self.lx = e.clientX; self.ly = e.clientY;
    if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId);
  };
  this._onUp = function () { self.drag = false; };
  this._onMove = function (e) {
    if (!self.drag) return;
    self.cam.theta -= (e.clientX - self.lx) * 0.005;
    self.cam.phi = Math.max(-1.5, Math.min(1.5, self.cam.phi + (e.clientY - self.ly) * 0.005));
    self.lx = e.clientX; self.ly = e.clientY;
  };
  this._onWheel = function (e) {
    e.preventDefault();
    self.cam.dist = Math.max(1.15, Math.min(9, self.cam.dist * (1 + Math.sign(e.deltaY) * 0.09)));
  };
  this._loop = function () { self.loop(); };

  this.compile();
  this.build(level);
  this.bindInput();
  this.loop();
}

Planet.prototype.mkTex = function (w, h, data, comps, linear) {
  if (comps === undefined) comps = 4;
  if (linear === undefined) linear = false;
  var gl = this.gl;
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  var internal = comps === 1 ? gl.R32F : gl.RGBA32F;
  var fmt = comps === 1 ? gl.RED : gl.RGBA;
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, fmt, gl.FLOAT, data);
  var f = linear ? gl.LINEAR : gl.NEAREST;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
};
Planet.prototype.mkFbo = function (texs) {
  var gl = this.gl;
  var f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  texs.forEach(function (t, i) {
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0);
  });
  gl.drawBuffers(texs.map(function (_, i) { return gl.COLOR_ATTACHMENT0 + i; }));
  var st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if (st !== gl.FRAMEBUFFER_COMPLETE) console.error('FBO incomplete', st.toString(16));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return f;
};
Planet.prototype.compile = function () {
  var gl = this.gl;
  this.prog.ocean = new Prog(gl, QUAD_VS, OCEAN_FS, 'ocean');
  this.prog.air = new Prog(gl, QUAD_VS, AIR_FS, 'air');
  this.prog.cplO = new Prog(gl, QUAD_VS, COUPLE_FS('ocean'), 'coupleOcean');
  this.prog.cplA = new Prog(gl, QUAD_VS, COUPLE_FS('air'), 'coupleAir');
  this.prog.init = new Prog(gl, QUAD_VS, INIT_FS, 'init');
  this.prog.init2 = new Prog(gl, QUAD_VS, INIT2_FS, 'init2');
  this.prog.part = new Prog(gl, QUAD_VS, PART_FS, 'part');
  this.prog.points = new Prog(gl, PART_VS, PART_PS, 'points');
  this.prog.globe = new Prog(gl, GLOBE_VS, GLOBE_FS, 'globe');
  this.prog.cloud = new Prog(gl, CLOUD_VS, CLOUD_FS, 'cloud');
};

Planet.prototype.build = function (level) {
  var gl = this.gl;
  this.destroyGrid();
  var g = buildGrid(level);
  this.grid = g;
  var W = g.W, H = g.H;

  this.texCellA = this.mkTex(W, H, g.cellA);
  this.texCellB = this.mkTex(W, H, g.cellB);
  this.texNbrA = this.mkTex(W, H * 6, g.nbrA);
  this.texNbrB = this.mkTex(W, H * 6, g.nbrB);
  this.texLookup = this.mkTex(g.lookupW, g.lookupH, g.lookup, 1);

  this.A = []; this.B = [];
  for (var i = 0; i < 6; i++) {
    this.A.push(this.mkTex(W, H, null));
    this.B.push(this.mkTex(W, H, null));
  }
  this.fbo.dynO = this.mkFbo([this.B[0], this.B[1]]);
  this.fbo.dynA = this.mkFbo([this.B[2], this.B[3], this.B[4], this.B[5]]);
  this.fbo.cplO = this.mkFbo([this.A[0], this.A[1]]);
  this.fbo.cplA = this.mkFbo([this.A[2], this.A[3], this.A[4], this.A[5]]);
  this.fbo.init = this.mkFbo([this.A[0], this.A[1], this.A[2], this.A[3]]);
  this.fbo.init2 = this.mkFbo([this.A[4], this.A[5]]);

  var pdata = new Float32Array(this.PW * this.PH * 4);
  for (var j = 0; j < this.PW * this.PH; j++) {
    var z = Math.random() * 2 - 1, a = Math.random() * 6.2831853, r = Math.sqrt(1 - z * z);
    pdata[j * 4] = r * Math.cos(a); pdata[j * 4 + 1] = z; pdata[j * 4 + 2] = r * Math.sin(a);
    pdata[j * 4 + 3] = Math.random();
  }
  this.partTex = [this.mkTex(this.PW, this.PH, pdata), this.mkTex(this.PW, this.PH, pdata)];
  this.fbo.p0 = this.mkFbo([this.partTex[0]]);
  this.fbo.p1 = this.mkFbo([this.partTex[1]]);

  this.ibo = gl.createBuffer();
  this.vaoGlobe = gl.createVertexArray();
  gl.bindVertexArray(this.vaoGlobe);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, g.indices, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  this.vaoEmpty = gl.createVertexArray();

  this.reset();
};

Planet.prototype.destroyGrid = function () {
  var gl = this.gl;
  var all = this.A.concat(this.B, this.partTex, [this.texCellA, this.texCellB, this.texNbrA, this.texNbrB, this.texLookup]);
  all.forEach(function (t) { if (t) gl.deleteTexture(t); });
  Object.keys(this.fbo).forEach(function (k) { gl.deleteFramebuffer(this.fbo[k]); }, this);
  this.fbo = {};
  if (this.ibo) gl.deleteBuffer(this.ibo);
  if (this.vaoGlobe) gl.deleteVertexArray(this.vaoGlobe);
  if (this.vaoEmpty) gl.deleteVertexArray(this.vaoEmpty);
  this.A = []; this.B = []; this.partTex = [];
};

Planet.prototype.gridUniforms = function (p) {
  p.iv2('uDim', this.grid.W, this.grid.H).i('uCount', this.grid.V)
    .tex('uCellA', this.texCellA).tex('uCellB', this.texCellB)
    .tex('uNbrA', this.texNbrA).tex('uNbrB', this.texNbrB);
};
Planet.prototype.fullscreen = function (fboName, w, h) {
  var gl = this.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo[fboName]);
  gl.viewport(0, 0, w, h);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  gl.bindVertexArray(this.vaoEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
};

Planet.prototype.reset = function () {
  var W = this.grid.W, H = this.grid.H;
  this.simTime = 0;
  var p = this.prog.init.use();
  this.gridUniforms(p); p.f('uSeed', Math.random() * 1000);
  this.fullscreen('init', W, H);
  var p2 = this.prog.init2.use();
  this.gridUniforms(p2); p2.f('uSeed', Math.random() * 1000);
  this.fullscreen('init2', W, H);
};

Planet.prototype.couple = function () {
  var W = this.grid.W, H = this.grid.H;
  var P = this.params;
  var src = this.B;
  var sun = this.sunDir();
  var self = this;
  [['cplO', 'cplO'], ['cplA', 'cplA']].forEach(function (pair) {
    var pr = self.prog[pair[1]].use();
    self.gridUniforms(pr);
    pr.tex('uTop', src[0]).tex('uDeep', src[1]).tex('uLoA', src[2])
      .tex('uLoB', src[3]).tex('uHiA', src[4]).tex('uHiB', src[5]);
    pr.f('uDt', P.dt).f('uTime', self.simTime)
      .v3('uSun', sun[0], sun[1], sun[2])
      .f('uSolar', P.solar).f('uDayNight', P.dayNight).f('uSeasonDecl', self.decl())
      .f('uKsurf', P.kSurf).f('uEvap', P.evap).f('uWindStress', P.windStress)
      .f('uConv', P.conv).f('uKrad', P.kRad).f('uLapse', P.lapse)
      .f('uThermo', P.thermo).f('uCloudK', P.cloudK).f('uRainK', P.rainK)
      .f('uNoise', P.noise).f('uGreenhouse', P.greenhouse);
    self.fullscreen(pair[0], W, H);
  });
};

Planet.prototype.decl = function () {
  return 0.4084 * Math.sin((this.simTime / (365 * 86400)) * 6.2831853);
};
Planet.prototype.sunDir = function () {
  var d = this.decl();
  var lon = 6.2831853 * (this.simTime / 86400);
  return [Math.cos(d) * Math.cos(lon), Math.sin(d), Math.cos(d) * Math.sin(lon)];
};

Planet.prototype.step = function () {
  var W = this.grid.W, H = this.grid.H;
  var P = this.params;

  var po = this.prog.ocean.use();
  this.gridUniforms(po);
  po.tex('uTop', this.A[0]).tex('uDeep', this.A[1])
    .f('uDt', P.dt).f('uOmega', P.omega)
    .f('uNuVel', P.nuVelOcean).f('uNuT', P.nuTOcean)
    .f('uFricTop', P.fricOceanTop).f('uFricDeep', P.fricOceanDeep)
    .f('uAlphaT', 1.7e-4).f('uBetaS', 7.8e-4)
    .f('uPkTop', 9.81 * 200 * 1027).f('uPkDeep', 9.81 * 800 * 1027);
  this.fullscreen('dynO', W, H);

  var pa = this.prog.air.use();
  this.gridUniforms(pa);
  pa.tex('uLoA', this.A[2]).tex('uLoB', this.A[3]).tex('uHiA', this.A[4]).tex('uHiB', this.A[5])
    .f('uDt', P.dt).f('uOmega', P.omega)
    .f('uNuVel', P.nuVelAir).f('uNuT', P.nuTAir)
    .f('uFricLo', P.fricAirLow).f('uFricHi', P.fricAirHigh)
    .f('uRhoLo', 1.1).f('uRhoHi', 0.55);
  this.fullscreen('dynA', W, H);

  this.couple();
  this.simTime += P.dt;
};

Planet.prototype.stepParticles = function (dt) {
  var gl = this.gl;
  var src = this.partTex[this.partIdx];
  var dstFbo = this.partIdx === 0 ? 'p1' : 'p0';
  var p = this.prog.part.use();
  this.gridUniforms(p);
  p.tex('uPart', src).tex('uLookup', this.texLookup)
    .tex('uLoA', this.A[2]).tex('uTop', this.A[0])
    .iv2('uPDim', this.PW, this.PH)
    .f('uDt', dt).f('uLife', 60 * 3600).f('uRadius', PLANET_R)
    .f('uSeed', Math.random() * 1000).f('uOcean', this.params.particleOcean);
  this.fullscreen(dstFbo, this.PW, this.PH);
  this.partIdx = 1 - this.partIdx;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
};

Planet.prototype.render = function () {
  var gl = this.gl;
  var P = this.params;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(1, Math.floor(this.canvas.clientWidth * dpr));
  var h = Math.max(1, Math.floor(this.canvas.clientHeight * dpr));
  if (this.canvas.width !== w || this.canvas.height !== h) {
    this.canvas.width = w; this.canvas.height = h;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0.015, 0.02, 0.045, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.frontFace(gl.CCW);

  var c = this.cam;
  var eye = [
    c.dist * Math.cos(c.phi) * Math.sin(c.theta),
    c.dist * Math.sin(c.phi),
    c.dist * Math.cos(c.phi) * Math.cos(c.theta),
  ];
  var proj = m4.persp(0.9, w / h, 0.05, 40);
  var view = m4.look(eye, [0, 0, 0], [0, 1, 0]);
  var mvp = m4.mul(proj, view);
  var sun = this.sunDir();

  var g = this.prog.globe.use();
  this.gridUniforms(g);
  g.tex('uTop', this.A[0]).tex('uDeep', this.A[1]).tex('uLoA', this.A[2])
    .tex('uLoB', this.A[3]).tex('uHiA', this.A[4]).tex('uHiB', this.A[5])
    .m4('uMVP', mvp).i('uMode', P.mode)
    .v3('uSun', sun[0], sun[1], sun[2]).v3('uEye', eye[0], eye[1], eye[2])
    .f('uShowLand', P.showLand).f('uNight', P.nightShading).f('uRelief', P.relief);
  gl.bindVertexArray(this.vaoGlobe);
  gl.drawElements(gl.TRIANGLES, this.grid.indices.length, gl.UNSIGNED_INT, 0);

  if (P.showClouds) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    var cl = this.prog.cloud.use();
    this.gridUniforms(cl);
    cl.tex('uLoB', this.A[3]).tex('uHiB', this.A[5])
      .m4('uMVP', mvp).f('uShellR', 1.02)
      .v3('uSun', sun[0], sun[1], sun[2]).f('uNight', P.nightShading);
    gl.drawElements(gl.TRIANGLES, this.grid.indices.length, gl.UNSIGNED_INT, 0);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }

  if (P.showParticles) {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    var pp = this.prog.points.use();
    this.gridUniforms(pp);
    pp.tex('uPart', this.partTex[this.partIdx]).tex('uLookup', this.texLookup)
      .tex('uLoA', this.A[2]).tex('uTop', this.A[0])
      .iv2('uPDim', this.PW, this.PH).m4('uMVP', mvp)
      .f('uPointSize', P.pointSize * Math.min(2, dpr))
      .f('uOcean', P.particleOcean);
    gl.bindVertexArray(this.vaoEmpty);
    gl.drawArrays(gl.POINTS, 0, this.PW * this.PH);
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.enable(gl.CULL_FACE);
  }
  gl.bindVertexArray(null);
};

Planet.prototype.loop = function () {
  if (this.disposed) return;
  this.raf = requestAnimationFrame(this._loop);
  var P = this.params;
  if (P.running) {
    for (var i = 0; i < P.substeps; i++) this.step();
    this.stepParticles(P.dt * P.substeps);
  }
  this.render();
  this.frames++;
  var now = performance.now();
  if (now - this.lastFps > 500) {
    this.fps = (this.frames * 1000) / (now - this.lastFps);
    this.frames = 0; this.lastFps = now;
    if (this.onStats) this.onStats({
      fps: this.fps, days: this.simTime / 86400,
      cells: this.grid.V, level: this.grid.level,
    });
  }
};

Planet.prototype.bindInput = function () {
  var c = this.canvas;
  c.addEventListener('pointerdown', this._onDown);
  window.addEventListener('pointerup', this._onUp);
  window.addEventListener('pointermove', this._onMove);
  c.addEventListener('wheel', this._onWheel, { passive: false });
};
Planet.prototype.dispose = function () {
  this.disposed = true;
  cancelAnimationFrame(this.raf);
  var c = this.canvas;
  c.removeEventListener('pointerdown', this._onDown);
  window.removeEventListener('pointerup', this._onUp);
  window.removeEventListener('pointermove', this._onMove);
  c.removeEventListener('wheel', this._onWheel);
  this.destroyGrid();
};

function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

function setParam(k, v) {
  if (ui.planet) ui.planet.params[k] = v;
  refreshDynamic();
}
function rebuild(l) {
  ui.level = l;
  var p = ui.planet;
  if (!p) return;
  var keep = {};
  Object.keys(p.params).forEach(function (key) { keep[key] = p.params[key]; });
  p.build(l);
  Object.keys(keep).forEach(function (key) { p.params[key] = keep[key]; });
  refreshDynamic();
}

function refreshDynamic() {
  var P = ui.planet ? ui.planet.params : defaultParams();
  if (ui.runBtn) {
    ui.runBtn.textContent = P.running ? '❚❚ pause' : '▶ run';
    ui.runBtn.className = 'btn flex1 ' + (P.running ? 'run on' : 'run off');
    ui.runBtn.style.flex = '1';
  }
  ui.modeBtns.forEach(function (b, i) {
    b.className = 'mbtn' + (P.mode === i ? ' on' : '');
  });
  ui.levelBtns.forEach(function (b, i) {
    var l = 4 + i;
    b.className = 'mbtn' + (ui.level === l ? ' on' : '');
  });
  Object.keys(ui.checks).forEach(function (k) {
    ui.checks[k].checked = P[k] > 0.5;
  });
  Object.keys(ui.knobVals).forEach(function (key) {
    var k = KNOBS.find(function (x) { return x.key === key; });
    var v = P[key];
    ui.knobVals[key].textContent = k.fmt ? k.fmt(v) : String(v);
  });
}

function buildUI() {
  var app = document.getElementById('app');

  // header
  var hdr = el('div', 'hdr');
  var box = el('div', 'box');
  box.appendChild(el('div', 'title', 'GEODESIC PLANET · GPU CLIMATE ENGINE'));
  var sub = el('div', 'sub');
  sub.textContent = 'icosahedral dual-hex grid · ';
  var cellSpan = el('span');
  cellSpan.textContent = '0';
  sub.appendChild(cellSpan);
  sub.appendChild(document.createTextNode(' cells (L'));
  var lvlSpan = el('span'); lvlSpan.textContent = '5';
  sub.appendChild(lvlSpan);
  sub.appendChild(document.createTextNode(') · 4 stacked fluid layers · all state on the GPU'));
  box.appendChild(sub);
  var mono = el('div', 'mono');
  var fpsEl = el('span', 'g', '0 fps');
  var dayEl = el('span', 'a', 'day 0.0');
  var yrEl = el('span', 's', '0.00 yr');
  mono.appendChild(fpsEl); mono.appendChild(dayEl); mono.appendChild(yrEl);
  box.appendChild(mono);
  ui.fpsEls = { cellSpan: cellSpan, lvlSpan: lvlSpan, fps: fpsEl, day: dayEl, yr: yrEl };

  hdr.appendChild(box);
  var panelToggle = el('button', 'btn', 'hide panel');
  panelToggle.onclick = function () {
    ui.panel = !ui.panel;
    panelToggle.textContent = ui.panel ? 'hide panel' : 'show panel';
    ui.panelEl.style.display = ui.panel ? '' : 'none';
  };
  ui.panelToggleBtn = panelToggle;
  hdr.appendChild(panelToggle);
  app.appendChild(hdr);

  // panel
  var panel = el('div', 'panel');
  ui.panelEl = panel;

  // run / reset
  var row = el('div', 'row');
  var runBtn = el('button', 'btn', '❚❚ pause');
  runBtn.style.flex = '1';
  runBtn.onclick = function () { setParam('running', !ui.planet.params.running); };
  var resetBtn = el('button', 'btn', '↻ reset');
  resetBtn.style.flex = '1';
  resetBtn.onclick = function () { ui.planet.reset(); };
  row.appendChild(runBtn); row.appendChild(resetBtn);
  ui.runBtn = runBtn;
  panel.appendChild(row);

  // layer view
  panel.appendChild(el('div', 'lab', 'Layer view'));
  var grid2 = el('div', 'grid2');
  MODES.forEach(function (m, i) {
    var b = el('button', 'mbtn', m);
    b.onclick = function () { setParam('mode', i); };
    ui.modeBtns.push(b);
    grid2.appendChild(b);
  });
  panel.appendChild(grid2);
  var bar = el('div', 'bar');
  panel.appendChild(bar);
  var barlab = el('div', 'barlab');
  barlab.appendChild(el('span', null, 'low'));
  barlab.appendChild(el('span', null, 'high'));
  panel.appendChild(barlab);

  // checkboxes
  var chkDefs = [
    ['showClouds', 'Clouds & rain overlay'],
    ['showParticles', 'Wind streamlines'],
    ['particleOcean', 'Streamlines follow ocean'],
    ['dayNight', 'Day / night cycle'],
    ['nightShading', 'Night shading'],
    ['showLand', 'Show continents'],
  ];
  chkDefs.forEach(function (d) {
    var lab = el('label', 'chk');
    lab.appendChild(el('span', null, d[1]));
    var inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.className = 'accent-cyan-400';
    inp.onchange = function () { setParam(d[0], inp.checked ? 1 : 0); };
    ui.checks[d[0]] = inp;
    lab.appendChild(inp);
    panel.appendChild(lab);
  });

  // subdivision level
  panel.appendChild(el('div', 'lab', 'Subdivision level'));
  var lvlRow = el('div', 'row');
  [4, 5, 6, 7].forEach(function (l, idx) {
    var b = el('button', 'mbtn', 'L' + l);
    var sub2 = el('div');
    sub2.style.fontSize = '9px';
    sub2.style.opacity = '0.6';
    sub2.textContent = (10 * Math.pow(4, l) + 2).toLocaleString();
    b.appendChild(sub2);
    b.style.flex = '1';
    b.onclick = function () { rebuild(l); };
    ui.levelBtns.push(b);
    lvlRow.appendChild(b);
  });
  panel.appendChild(lvlRow);

  // tuning
  var tuningToggle = el('button', 'togbtn', '▸ physics tuning knobs');
  ui.tuningToggleBtn = tuningToggle;
  tuningToggle.onclick = function () {
    ui.tuning = !ui.tuning;
    tuningToggle.textContent = (ui.tuning ? '▾' : '▸') + ' physics tuning knobs';
    tuningSection.style.display = ui.tuning ? '' : 'none';
  };
  panel.appendChild(tuningToggle);
  var tuningSection = el('div');
  tuningSection.style.display = 'none';
  tuningSection.style.marginTop = '8px';
  KNOBS.forEach(function (k) {
    var wrap = el('div');
    wrap.style.marginBottom = '10px';
    var kv = el('div', 'kv');
    kv.appendChild(el('span', null, k.label));
    var val = el('span', 'v', '');
    kv.appendChild(val);
    ui.knobVals[k.key] = val;
    wrap.appendChild(kv);
    var inp = document.createElement('input');
    inp.type = 'range';
    inp.min = k.min; inp.max = k.max; inp.step = k.step;
    inp.value = defaultParams()[k.key];
    inp.oninput = function () { setParam(k.key, parseFloat(inp.value)); };
    wrap.appendChild(inp);
    tuningSection.appendChild(wrap);
  });
  var restore = el('button', 'togbtn', 'restore defaults');
  restore.onclick = function () {
    var def = defaultParams();
    Object.keys(def).forEach(function (key) { ui.planet.params[key] = def[key]; });
    // sync slider positions
    tuningSection.querySelectorAll('input[type=range]').forEach(function (inp, idx) {
      inp.value = def[KNOBS[idx].key];
    });
    refreshDynamic();
  };
  tuningSection.appendChild(restore);
  ui.tuningSection = tuningSection;
  panel.appendChild(tuningSection);

  var desc = el('p', 'desc',
    'drag to orbit · wheel to zoom. Winds, ocean gyres, Hadley/Ferrel-like cells and ' +
    'storm bands are emergent: nothing is scripted. Only pressure is diagnosed; ' +
    'everything else is integrated on the dual hexagonal grid with flux-form upwind ' +
    'advection and finite-volume operators.');
  panel.appendChild(desc);

  app.appendChild(panel);

  // error overlay (created later if needed)
  ui.errBox = null;
}

function showError(msg) {
  if (ui.errBox) return;
  var app = document.getElementById('app');
  var wrap = el('div', 'err');
  var box = el('div', 'errbox');
  box.appendChild(el('h2', null, 'WebGL2 error'));
  box.appendChild(el('p', null, msg));
  wrap.appendChild(box);
  ui.errBox = wrap;
  app.appendChild(wrap);
}

function boot() {
  var canvas = document.getElementById('c');
  buildUI();
  try {
    var p = new Planet(canvas, 5);
    p.onStats = function (s) {
      ui.stats = s;
      ui.fpsEls.fps.textContent = s.fps.toFixed(0) + ' fps';
      ui.fpsEls.day.textContent = 'day ' + s.days.toFixed(1);
      ui.fpsEls.yr.textContent = (s.days / 365).toFixed(2) + ' yr';
      ui.fpsEls.cellSpan.textContent = s.cells.toLocaleString();
      ui.fpsEls.lvlSpan.textContent = String(s.level);
    };
    ui.planet = p;
    refreshDynamic();
  } catch (e) {
    showError(e && e.message ? e.message : String(e));
  }
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
